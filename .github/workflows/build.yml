# Gera o app para Windows e Linux. Baixe em Actions -> execução -> Artifacts.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: poc-teclado-windows
          path: app/build/windows/x64/runner/Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: poc-teclado-linux
          path: app/build/linux/x64/release/bundle
