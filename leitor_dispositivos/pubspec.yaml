name: leitor_dispositivos
description: "Lê portas seriais e aparelhos USB HID (teclados e afins), informando de qual aparelho veio cada leitura."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_libserialport: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: LeitorDispositivosPluginCApi
